<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NyayaAI — Clickable Prototype</title>

<!--
  ============================================================
  NyayaAI — investor / lawyer demo prototype
  Everything on this page is FAKE and HARDCODED. No backend,
  no network calls beyond the CDN libraries below, no storage.

  DEMO SCRIPT (ideal click-through order, ~4 minutes):
    1. Login        — type any phone number → Get OTP
    2. OTP           — auto-fills → lands on Today dashboard
    3. Today         — tap the bell (notifications), then tap
                        "＋ Add Case" → paste any 16 chars as
                        CNR → watch it fetch from eCourts
    4. Case detail    — tap the first hearing card → flip
                        through Overview / Hearings / Documents
    5. AI Researcher — AI tab → Research Case Law → ask
                        anything → see cited answer, tap a
                        citation
    6. AI Summarizer — AI tab → Summarize a Document →
                        Chargesheet - Ramesh Kumar.pdf
    7. Invoice        — More → Invoices & Payments → Preview
                        client view
    8. Client mode    — Pay ₹29,500 → pick a UPI app → success
                        → Exit client preview to see the
                        lawyer-side payment notification
  ============================================================
-->

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
:root{
  --ink:#16233b;--ink-2:#0e1830;--ink-3:#243759;
  --ivory:#f6f2e8;--paper:#fffdf7;--card:#fffefa;
  --saffron:#e8861b;--saffron-d:#c96f0a;--saffron-t:#fdeeda;
  --green:#1e7a4d;--green-t:#e3f2e9;
  --red:#b3402f;--red-t:#f9e6e1;
  --blue-t:#e8eef9;
  --line:#e7e0d0;--muted:#847b69;--gold:#caa14a;
  --white:#ffffff;
  --surface-page:var(--ivory);--surface-card:var(--card);--surface-sunk:var(--paper);
  --accent:var(--saffron);--accent-strong:var(--saffron-d);--accent-tint:var(--saffron-t);
  --gold-accent:var(--gold);
  --success:var(--green);--success-tint:var(--green-t);
  --danger:var(--red);--danger-tint:var(--red-t);
  --border:var(--line);
  --font-serif:Georgia,'Times New Roman',serif;
  --font-sans:-apple-system,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;
  --text-h2:16px;
  --radius-md:14px;
  --shadow-card:0 10px 24px rgba(22,35,59,.10);
  --shadow-fab:0 10px 24px rgba(201,111,10,.45);
  --shadow-crest:0 14px 34px rgba(201,111,10,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-sans);
  background:#0b0e14;
  min-height:100vh;
}
.demo-stage{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;
  background:radial-gradient(1200px 700px at 50% -10%,#232f4a 0%,#12161f 55%,#0b0e14 100%);
}
.kit-label{color:#8e97ab;font-family:var(--font-serif);text-align:center;font-size:15px}
.kit-label b{color:#e9ddc0;font-size:19px;display:block;margin-bottom:3px}
.phone{width:360px;height:800px;background:var(--ivory);border-radius:38px;border:10px solid #05070c;box-shadow:0 30px 80px rgba(0,0,0,.65);overflow:hidden;position:relative;display:flex;flex-direction:column}
.statusbar{height:34px;background:var(--ink);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:12px;font-weight:600;flex:none;font-family:var(--font-serif);letter-spacing:.3px}
.screen{flex:1;overflow-y:auto;position:relative;-webkit-overflow-scrolling:touch}
.screen-inner-wrap{height:100%}
.screen-inner{padding:16px 16px 96px;animation:fadein .28s ease}
.tight .screen-inner{padding-top:0}

.appbar{background:var(--ink);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.appbar h1{font-family:var(--font-serif);font-weight:600;font-size:19px;letter-spacing:.3px;margin:0}
.appbar .sub{font-size:11px;color:#aeb8cd;margin-top:1px}
.appbar .titlewrap{flex:1;min-width:0}
.iconbtn{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.12);border:0;color:#fff;font-size:16px;cursor:pointer;flex:none;position:relative;transition:transform .12s}
.iconbtn.sm{width:32px;height:32px}
.iconbtn:active{transform:scale(.9)}
.badge{position:absolute;top:-4px;right:-4px;background:var(--saffron);color:#fff;font-size:9px;font-weight:800;border-radius:9px;min-width:16px;height:16px;line-height:16px;text-align:center;border:2px solid var(--ink);padding:0 3px}

.tabs{display:flex;background:var(--surface-sunk);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:4}
.tabs button{flex:1;background:none;border:0;padding:12px 2px;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;font-family:var(--font-sans)}
.tabs button.active{color:var(--ink);border-bottom-color:var(--saffron)}

.card{background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:14px;margin-bottom:12px}
.card.pressable{cursor:pointer;transition:transform .1s}
.card.pressable:active{transform:scale(.985)}
.card.accent{border-left:4px solid var(--accent)}

.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font-sans);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:#fff}
.btn.saffron{background:linear-gradient(135deg,var(--saffron),var(--saffron-d));color:#fff;box-shadow:var(--shadow-fab)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.half{width:auto;flex:1}
.btn:disabled{opacity:.35;pointer-events:none}
.btn-row{display:flex;gap:9px;margin-bottom:10px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.2px;font-family:var(--font-sans);border:0;cursor:default;flex-shrink:0;white-space:nowrap}

.chip.err{background:var(--danger-tint);color:var(--danger)}

.shead{font-family:var(--font-serif);font-size:var(--text-h2);color:var(--ink);margin:18px 0 10px;display:flex;align-items:baseline;gap:8px}

.doc .ic{width:40px;height:46px;border-radius:8px;background:var(--danger-tint);color:var(--danger);font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.doc .meta{flex:1;min-width:0}
.doc .name{font-size:13.5px;font-weight:700;color:var(--ink)}
.doc .sub{font-size:11px;color:var(--muted);margin-top:3px}
.doc .badge2{margin-left:auto;flex:none;display:inline-flex;align-items:center;padding:5px 11px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--saffron-t);color:var(--saffron-d)}

.nrow{display:flex;gap:11px;padding:12px 2px;border-bottom:1px solid var(--border)}
.nrow:last-child{border-bottom:0}
.nrow .ic{width:36px;height:36px;border-radius:11px;background:var(--saffron-t);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.nrow .t{font-size:13px;font-weight:700;color:var(--ink)}
.nrow .m{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}

.tl{position:relative;padding-left:22px;margin-bottom:16px}
.tl .dot{position:absolute;left:6px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--saffron);border:2px solid #fff;box-shadow:0 0 0 1.5px var(--saffron)}
.tl .line{position:absolute;left:9.5px;top:18px;bottom:-14px;width:2px;background:var(--border)}
.tl .date{font-size:10.5px;font-weight:800;letter-spacing:.6px;color:var(--saffron-d);text-transform:uppercase}
.tl .title{font-size:13.5px;color:var(--ink);font-weight:600;margin-top:2px}
.tl .note{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.45}

.inv-line{display:flex;justify-content:space-between;font-size:13.5px;padding:9px 0;border-bottom:1px dashed var(--border);color:#3b382f}
.inv-line b{color:var(--ink);text-align:right;max-width:60%}
.inv-total{display:flex;justify-content:space-between;padding:12px 0 2px;font-size:16px;font-weight:800;color:var(--ink)}

.bub{max-width:84%;padding:11px 14px;border-radius:16px;font-size:13.5px;line-height:1.55;margin-bottom:10px}
.bub.user{background:var(--ink);color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.bub.ai{background:#fff;border:1px solid var(--border);color:#2c2a24;border-bottom-left-radius:5px;box-shadow:var(--shadow-card)}
.thinking-dots{display:inline-flex;gap:4px;padding:6px 4px}
.thinking-dots i{width:7px;height:7px;border-radius:50%;background:#b9ad92;display:inline-block;animation:tpulse 1s infinite ease-in-out}
.thinking-dots i:nth-child(2){animation-delay:.15s}
.thinking-dots i:nth-child(3){animation-delay:.3s}

.cite{background:var(--saffron-t);border:1px solid #f0d9b6;border-radius:11px;padding:9px 11px;margin-top:8px;cursor:pointer;transition:transform .1s}
.cite:active{transform:scale(.98)}
.cite .t{font-size:12.5px;font-weight:800;color:var(--ink)}
.cite .s{font-size:11px;color:#8a6a33;margin-top:2px;line-height:1.4}

.disc{background:#fbf4e6;border:1px dashed var(--gold);color:#7a6122;font-size:11px;padding:8px 11px;border-radius:10px;margin:10px 0;display:flex;gap:7px;line-height:1.45}

.otps{display:flex;gap:8px;justify-content:space-between}
.otps b{flex:1;height:52px;border-radius:12px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:400;animation:popin .25s}
.otps b.filled{background:rgba(232,134,27,.18);border-color:var(--saffron)}

.role{border:1.5px solid var(--border);border-radius:14px;padding:14px;background:#fff;margin-bottom:11px;cursor:pointer;display:flex;gap:12px;align-items:center;transition:transform .1s}
.role:active{transform:scale(.98)}
.role.sel{border-color:var(--saffron);background:var(--saffron-t)}
.role .ic{font-size:24px}
.role .t{font-weight:800;color:var(--ink);font-size:14.5px}
.role .s{font-size:11.5px;color:var(--muted);margin-top:2px}

.search{display:flex;align-items:center;gap:9px;background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:12px;color:var(--muted);font-size:14px}
.fchips{display:flex;gap:7px;overflow-x:auto;padding-bottom:12px}

.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field textarea{width:100%;border:1.5px solid var(--border);background:#fff;border-radius:12px;padding:13px;font-size:15px;font-family:var(--font-sans);outline:0;box-sizing:border-box}
.field .hint{font-size:11px;color:var(--muted);margin-top:5px}

#nav{position:absolute;bottom:0;left:0;right:0;background:var(--surface-sunk);border-top:1px solid var(--border);display:flex;padding:6px 4px 10px;z-index:6}
#nav button{flex:1;background:none;border:0;font-size:10px;font-weight:700;color:var(--muted);cursor:pointer;padding:5px 0;border-radius:10px;font-family:var(--font-sans)}
#nav button.active{color:var(--ink)}
#nav button span{display:block;font-size:19px;margin-bottom:2px;opacity:.55;filter:grayscale(1)}
#nav button.active span{opacity:1;filter:none}

.fab{position:absolute;right:16px;bottom:86px;background:linear-gradient(135deg,var(--saffron),var(--saffron-d));color:#fff;border:0;border-radius:16px;padding:14px 18px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:var(--shadow-fab);z-index:7;font-family:var(--font-sans);transition:transform .1s}
.fab:active{transform:scale(.94)}

#toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:82%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}

.scrim{position:absolute;inset:0;background:rgba(14,20,36,.5);opacity:0;pointer-events:none;transition:.25s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface-sunk);border-radius:22px 22px 0 0;transform:translateY(105%);transition:.3s cubic-bezier(.2,.8,.25,1);z-index:50;padding:10px 18px 26px;max-height:80%;overflow-y:auto}
.sheet.show{transform:none}
.sheet .grabber{width:40px;height:4px;border-radius:4px;background:var(--border);margin:6px auto 14px}
.sheet h2{font-family:var(--font-serif);font-size:18px;color:var(--ink);margin:0 0 4px}
.sheet .subtitle{font-size:12px;color:var(--muted);margin-bottom:14px}

.spinner{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--saffron);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
.spinner.lg{width:38px;height:38px;border-width:4px}
.loadwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px 20px;color:var(--muted);font-size:13px;font-weight:600}

.pbar{height:8px;background:#ece5d4;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--saffron),var(--gold));border-radius:99px;transition:width .5s ease}

.cal{background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:14px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-head b{font-family:var(--font-serif);font-size:16px;color:var(--ink)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-dow{font-size:9.5px;font-weight:800;color:var(--muted);padding:4px 0;letter-spacing:.5px}
.cal-day{position:relative;padding:8px 0 12px;font-size:12.5px;border-radius:9px;cursor:pointer;font-weight:600;color:#4b473c;border:0;background:transparent;font-family:var(--font-sans)}
.cal-day.today{background:var(--ink);color:#fff}
.cal-day.sel:not(.today){outline:2px solid var(--saffron)}
.cal-day .dd{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--saffron)}

.upi-row{display:flex;gap:12px;overflow-x:auto;padding:4px 0 6px}
.upi-app{flex:none;width:66px;text-align:center;cursor:pointer;background:none;border:0;font-family:var(--font-sans)}
.upi-app:active{transform:scale(.94)}
.upi-app .ic{width:52px;height:52px;border-radius:14px;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 5px}
.upi-app .lb{font-size:10.5px;font-weight:700;color:var(--ink)}
.check-ring{width:70px;height:70px;border-radius:50%;background:var(--success-tint);display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--success);margin:6px auto 0;animation:popin .4s}

.plan-card{background:linear-gradient(140deg,var(--ink),var(--ink-3));color:#fff;border-radius:14px;padding:16px;margin-bottom:12px}
.plan-card .eyebrow{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-accent);font-weight:800}
.plan-card .plan-name{font-family:var(--font-serif);font-size:19px;margin-top:4px}
.plan-card .usage{font-size:11.5px;color:#b9c2d6;margin-top:10px}
.plan-card .track{height:7px;background:rgba(255,255,255,.18);border-radius:99px;margin-top:8px}
.plan-card .track i{display:block;width:28%;height:100%;background:var(--saffron);border-radius:99px}

.seg{display:flex;background:#efe9db;border-radius:12px;padding:3px;margin-bottom:6px}
.seg button{flex:1;border:0;background:none;padding:9px 0;font-size:12.5px;font-weight:800;border-radius:9px;cursor:pointer;color:var(--muted);font-family:var(--font-sans)}
.seg button.active{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}

.tmpl{border:1.5px solid var(--border);border-radius:14px;padding:16px;background:#fff;margin-bottom:11px;cursor:pointer;transition:transform .1s}
.tmpl:active{transform:scale(.98)}
.tmpl .ic{font-size:22px;margin-bottom:6px}
.tmpl .t{font-weight:800;color:var(--ink);font-size:14.5px;font-family:var(--font-serif)}
.tmpl .s{font-size:11.5px;color:var(--muted);margin-top:3px}

.notice-doc{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;font-family:var(--font-serif);font-size:12.5px;line-height:1.7;color:#2c2a24}
.notice-doc h3{text-align:center;font-size:14px;letter-spacing:1px;margin:0 0 14px}

.center{text-align:center}
.muted{color:var(--muted)}

@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tpulse{0%,80%,100%{opacity:.35}40%{opacity:1}}
@keyframes popin{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
</style>

  else if (view === 'otp') body = <OtpScreen phone={phone} onBack={() => setView('login')} onVerify={() => setView('onboard')} />;
  else if (view === 'onboard') body = <OnboardScreen onDone={() => setView('today')} />;
  else if (view === 'today') body = <TodayScreen cases={cases} onOpenCase={openCase} onBell={() => setNotifOpen(true)} onAddCnr={() => setAddCnrOpen(true)} onAskAi={() => setView('research')} onScanDoc={soon} lang={lang} />;
  else if (view === 'cases') body = <CasesScreen cases={cases} onOpenCase={openCase} onAddCnr={() => setAddCnrOpen(true)} />;
  else if (view === 'casedetail') body = <CaseDetailScreen curCase={curCase} onBack={() => setView('cases')} onAskAi={() => setView('research')} onSync={() => showToast('Synced just now')} onSummarize={() => setView('summarizing')} />;
  else if (view === 'ai') body = <AiHubScreen onResearch={() => setView('research')} onSummarizer={() => setView('summarizer')} onDraftsman={() => setView('draftsman')} />;
  else if (view === 'research') body = <ResearchScreen onBack={() => setView('ai')} onOpenCite={(c) => { setCite(c); setCiteOpen(true); }} />;
  else if (view === 'summarizer') body = <SummarizerScreen onBack={() => setView('ai')} onDoneFile={(d) => d.key==='chargesheet' ? setView('summarizing') : soon()} />;
  else if (view === 'summarizing') body = <SummarizingScreenWrap onDone={() => setView('summary')} />;
  else if (view === 'summary') body = <SummaryResultScreen onBack={() => setView('ai')} />;
  else if (view === 'draftsman') body = <DraftsmanScreen onBack={() => setView('ai')} onPick={(t) => t.key==='notice138' ? setView('draftform') : soon()} />;
  else if (view === 'draftform') body = <DraftFormScreen onBack={() => setView('draftsman')} onGenerate={(f) => { setDraftForm(f); setView('generating'); }} />;
  else if (view === 'generating') body = <GeneratingScreenWrap onDone={() => setView('draftresult')} />;
  else if (view === 'draftresult') body = <DraftResultScreen onBack={() => setView('draftsman')} form={draftForm} onShare={() => showToast('Shared as DOCX')} />;
  else if (view === 'cal') body = <CalendarScreen onOpenCase={openCase} />;
  else if (view === 'more') body = <MoreScreen onInvoice={() => setView('invoice')} onClientMode={goClientMode} onSettings={() => setView('settings')} />;
  else if (view === 'settings') body = <SettingsScreen onBack={() => setView('more')} lang={lang} setLang={setLang} onSoon={soon} />;
  else if (view === 'invoice') body = <InvoiceScreen paid={paid} onBack={() => setView('more')} onPreview={goClientMode} onSend={() => showToast('Sent via WhatsApp + SMS')} />;
  else if (view === 'ccases') body = <ClientCasesScreen onOpen={() => setView('cstatus')} />;
  else if (view === 'cstatus') body = <ClientCaseStatusScreen onBack={() => setView('ccases')} />;
  else if (view === 'cinv') body = <ClientInvoicesScreen paid={paid} onPay={() => setUpiOpen(true)} />;
  else if (view === 'cprof') body = <ClientProfileScreen onExit={exitClientMode} onSoon={soon} />;

  return (
    <div className="demo-stage">
      <div className="kit-label"><b>NyayaAI</b>Investor / lawyer demo — click through the phone</div>
      <div className="phone">
        <div className="statusbar"><span>NyayaAI</span><span>9:41</span></div>
        <div className="screen">
          <div key={view + (clientMode?'-c':'')} className="screen-inner-wrap">{body}</div>
        </div>
        {!hideNav && (
          <div id="nav">
            {navList.map(it => (
              <button key={it[0]} className={navActive===it[0] ? 'active' : ''} onClick={() => setView(it[0])}>
                <span>{it[1]}</span>{it[2]}
              </button>
            ))}
          </div>
        )}
        <Toast msg={toast} />
        <Sheet open={notifOpen} onClose={() => setNotifOpen(false)}>
          <h2>Notifications</h2>
          <div className="subtitle">2 new</div>
          {NOTIFS.map((n,i) => <NotifRow key={i} icon={n.ic} title={n.t} message={n.m} />)}
        </Sheet>
        <CiteSheet open={citeOpen} onClose={() => setCiteOpen(false)} cite={cite} />
        <AddCnrSheet open={addCnrOpen} onClose={() => setAddCnrOpen(false)} onConfirm={confirmAddCnr} />
        <UpiSheet open={upiOpen} onClose={() => setUpiOpen(false)} onSuccess={onUpiSuccess} />
      </div>
    </div>
  );
}

function SummarizingScreenWrap({onDone}){
  useEffect(() => { const t = setTimeout(onDone, 3000); return () => clearTimeout(t); }, []);
  return <SummarizingScreen />;
}
function GeneratingScreenWrap({onDone}){
  useEffect(() => { const t = setTimeout(onDone, 2000); return () => clearTimeout(t); }, []);
  return <GeneratingScreen />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<NyayaApp />);
</script>
</body>
</html>
