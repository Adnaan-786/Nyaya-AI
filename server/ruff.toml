line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]
ignore = [
    # FastAPI's whole dependency mechanism is `Depends()` in defaults.
    "B008",
]

[lint.per-file-ignores]
# Tests assert on literals and build fixtures inline; that is the point of them.
"tests/*" = ["E501"]
