# Alembic configuration.
#
# The database URL is deliberately absent: it comes from DATABASE_URL via
# app.core.config in migrations/env.py, so there is exactly one place that knows how to
# reach the database and no credentials ever live in a tracked file.

[alembic]
script_location = migrations
prepend_sys_path = .
# Migration filenames sort chronologically, which makes `ls versions/` a readable
# history rather than a pile of opaque hashes.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = Asia/Kolkata

[post_write_hooks]
# Deliberately empty. A formatter hook here resolves `ruff` from PATH (or from a
# console-script entry point ruff's binary wheel does not register), so it fails on a
# fresh checkout where ruff lives in .venv/bin — turning "generate a migration" into an
# environment puzzle. Run `ruff format migrations/` after generating instead; CI lints
# the result either way.
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
