databases:
  - name: nyayaai-db
    plan: free
    databaseName: nyayaai
    region: singapore

services:
  - type: web
    name: nyayaai-api
    runtime: python
    region: singapore
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nyayaai-db
          property: connectionString
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: "false"
      - key: FAKE_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.13.2"
