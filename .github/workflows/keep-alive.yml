name: Keep server awake

# Render's free tier spins the web service down after 15 minutes of no traffic, and the
# next request pays a ~50s cold-start penalty — which reads as "the app is broken" to
# anyone testing it. This is a workaround, not a fix: it pings the health endpoint often
# enough that Render never sees 15 idle minutes. It is not a substitute for a paid
# always-on plan if this ever needs to behave like production.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health endpoint
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 https://nyayaai-api.onrender.com/v1/health)
          echo "health endpoint responded $status"
          if [ "$status" != "200" ]; then
            echo "::warning::Health check returned $status instead of 200"
          fi
