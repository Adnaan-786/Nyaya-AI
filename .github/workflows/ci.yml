name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # D.3.1 gate order matches what developers run locally, so a green local run
      # means a green CI run. Style first because it fails in seconds.
      - name: ktlint
        # The ktlint Gradle plugin (14.2.0) still cannot serialize its Android
        # source-set tasks for the configuration cache, which is on by default in
        # gradle.properties. Opting this one step out is cheaper than turning the
        # cache off for the whole build.
        run: ./gradlew ktlintCheck --no-configuration-cache

      - name: detekt
        run: ./gradlew detekt

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # Android Lint enforces the localization rules from D.4.3: HardcodedText and
      # MissingTranslation are errors, so an untranslated string cannot reach main.
      - name: Android Lint
        run: ./gradlew lintMockDebug

      - name: Assemble mock debug
        run: ./gradlew assembleMockDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/detekt/
            **/build/reports/lint-results-*.html
          retention-days: 7

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nyaya
          POSTGRES_PASSWORD: nyaya
          POSTGRES_DB: nyayaai
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://nyaya:nyaya@localhost:5432/nyayaai
      FAKE_MODE: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -r requirements.txt

      - name: Lint
        run: ./.venv/bin/ruff check app tests

      - name: Tests
        run: ./.venv/bin/python -m pytest -q
