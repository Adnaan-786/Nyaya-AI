name: NyayaAI CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run Tests
        run: uv run pytest

      - name: Start containers
        run: docker compose up -d

      - name: Wait
        run: sleep 10

      - name: Contract Test
        run: uv run schemathesis run http://127.0.0.1:8000/openapi.json